<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Hobbyligasaison 26/27</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root {
            --sva-green: #1a4731;
            --sva-yellow: #facc15;
        }
        body { 
            background-color: var(--sva-green); 
            font-family: 'Inter', sans-serif; 
            color: #f8fafc;
            background-image: linear-gradient(rgba(26, 71, 49, 0.95), rgba(26, 71, 49, 0.95)), 
                              url('https://i0.wp.com/www.alfen.de/wp-content/uploads/2016/05/sva-logo-neu.gif');
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
        }
        .match-card { 
            background: rgba(255, 255, 255, 0.1); 
            backdrop-filter: blur(8px);
            border-radius: 12px; 
            padding: 12px; 
            border-left: 4px solid var(--sva-yellow); 
            transition: all 0.5s ease; 
        }
        .slot { 
            min-height: 48px; 
            background: rgba(255,255,255,0.05); 
            border: 1px dashed rgba(255,255,255,0.2); 
            border-radius: 8px; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            margin-top: 5px; 
            cursor: pointer; 
            font-size: 0.9rem; 
        }
        .slot.filled { 
            border-style: solid; 
            background: rgba(250, 204, 21, 0.2); 
            border-color: var(--sva-yellow); 
        }
        .player-chip { cursor: pointer; user-select: none; transition: all 0.2s; }
        .custom-scrollbar::-webkit-scrollbar { height: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: var(--sva-yellow); border-radius: 10px; }
    </style>
</head>
<body class="p-4 pb-48">

    <header class="mb-8 text-center pt-4">
        <img src="https://i0.wp.com/www.alfen.de/wp-content/uploads/2016/05/sva-logo-neu.gif" alt="SVA Logo" class="h-16 mx-auto mb-4 drop-shadow-lg">
        <h1 class="text-2xl font-black text-white uppercase tracking-tighter">Hobbyligasaison 25/26</h1>
    </header>

    <div class="max-w-md mx-auto space-y-8" id="match-container">
        <div class="space-y-3">
            <h2 class="text-[10px] font-bold text-yellow-400/80 ml-1 uppercase tracking-widest">Einzel Aufstellung</h2>
            <div class="match-card" id="e1">
                <h3 class="font-bold text-xs text-white/70 mb-1">1. EINZEL</h3>
                <div class="slot" onclick="handleSlotClick(this, 'einzel')">Besetzen...</div>
            </div>
            <div class="match-card" id="e2">
                <h3 class="font-bold text-xs text-white/70 mb-1">2. EINZEL</h3>
                <div class="slot" onclick="handleSlotClick(this, 'einzel')">Besetzen...</div>
            </div>
        </div>

        <div class="space-y-3">
            <h2 class="text-[10px] font-bold text-yellow-400/80 ml-1 uppercase tracking-widest">Doppel Aufstellung</h2>
            <div id="doppel-list" class="space-y-3"></div>
        </div>
    </div>

    <div class="fixed bottom-0 left-0 right-0 z-50">
        <div class="bg-slate-900/90 backdrop-blur-md border-t border-white/10 p-4">
            <div id="bench" class="flex gap-2 overflow-x-auto pb-4 custom-scrollbar"></div>
            
            <div class="mt-4 text-center">
                <a href="https://dbv.turnier.de/sport/team.aspx?id=E4A5657E-EF6C-488C-958B-BE46490FD7E7&team=67" 
                   target="_blank" 
                   class="inline-flex items-center text-[11px] text-yellow-400 hover:text-white transition-colors bg-white/5 px-4 py-2 rounded-full border border-yellow-400/30">
                    📊 Offizielle Staffel-Tabelle öffnen
                </a>
            </div>
        </div>
    </div>

    <script>
        const players = ["Michael", "Rainer", "Jokl", "Stephan", "Vanessa", "Damian", "Christian", "Sven", "Luis", "Ulli", "Ludwig", "Tina", "Andrea", "Sylvia", "Alex"]
            .map((name, index) => ({ id: index + 1, name, rank: index + 1 }));

        let state = {
            einzel: [null, null],
            doppel: [[null, null], [null, null], [null, null]]
        };
        let selectedPlayerId = null;

        function render() {
            renderBench();
            renderEinzel();
            renderDoppel();
        }

        function renderBench() {
            const bench = document.getElementById('bench');
            bench.innerHTML = '';
            players.forEach(p => {
                const count = getUsage(p.id);
                const isSelected = selectedPlayerId === p.id;
                const div = document.createElement('div');
                div.className = `player-chip shrink-0 px-4 py-3 rounded-xl text-sm font-bold shadow-lg transition-all ${isSelected ? 'bg-yellow-400 text-green-900 scale-105' : 'bg-white/10 text-white'} ${count >= 2 ? 'opacity-20 grayscale' : ''}`;
                div.innerHTML = `<span class="opacity-60 mr-1">${p.rank}.</span> ${p.name}`;
                div.onclick = () => { if(count < 2 || isSelected) { selectedPlayerId = isSelected ? null : p.id; render(); } };
                bench.appendChild(div);
            });
        }

        function getUsage(id) {
            let count = state.einzel.filter(p => p && p.id === id).length;
            state.doppel.forEach(d => count += d.filter(p => p && p.id === id).length);
            return count;
        }

        function renderEinzel() {
            const assigned = state.einzel.filter(Boolean).sort((a, b) => a.rank - b.rank);
            state.einzel = [assigned[0] || null, assigned[1] || null];
            [0, 1].forEach(i => {
                const slot = document.querySelectorAll('#match-container .match-card .slot')[i];
                const p = state.einzel[i];
                slot.innerHTML = p ? `<div class="font-bold text-yellow-400">${p.name} <span class="text-[9px] text-white/50 ml-1">R${p.rank}</span></div>` : 'Besetzen...';
                slot.className = `slot ${p ? 'filled' : ''}`;
            });
        }

        function renderDoppel() {
            const list = document.getElementById('doppel-list');
            const doppelData = state.doppel.map(pair => ({ pair, sum: (pair[0] && pair[1]) ? pair[0].rank + pair[1].rank : 999 }));
            doppelData.sort((a, b) => a.sum - b.sum);
            state.doppel = doppelData.map(d => d.pair);

            list.innerHTML = '';
            state.doppel.forEach((pair, i) => {
                const sum = (pair[0] && pair[1]) ? pair[0].rank + pair[1].rank : null;
                list.insertAdjacentHTML('beforeend', `
                    <div class="match-card">
                        <div class="flex justify-between items-center mb-1 text-[10px] font-bold text-white/50">
                            <span>${i+1}. DOPPEL</span>
                            ${sum ? `<span class="text-yellow-400">SUMME: ${sum}</span>` : ''}
                        </div>
                        <div class="grid grid-cols-2 gap-2">
                            <div class="slot ${pair[0] ? 'filled' : ''}" onclick="handleDoppelClick(${i}, 0)">
                                ${pair[0] ? `<span class="font-bold text-yellow-400">${pair[0].name}</span>` : 'Spieler A'}
                            </div>
                            <div class="slot ${pair[1] ? 'filled' : ''}" onclick="handleDoppelClick(${i}, 1)">
                                ${pair[1] ? `<span class="font-bold text-yellow-400">${pair[1].name}</span>` : 'Spieler B'}
                            </div>
                        </div>
                    </div>`);
            });
        }

        function handleSlotClick(el, type) {
            const index = Array.from(document.querySelectorAll('#e1 .slot, #e2 .slot')).indexOf(el);
            state.einzel[index] = selectedPlayerId ? players.find(p => p.id === selectedPlayerId) : null;
            selectedPlayerId = null;
            render();
        }

        function handleDoppelClick(pairIdx, playerIdx) {
            state.doppel[pairIdx][playerIdx] = selectedPlayerId ? players.find(p => p.id === selectedPlayerId) : null;
            selectedPlayerId = null;
            render();
        }

        render();
    </script>
</body>
</html>
