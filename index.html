<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Hobbyligasaison 26/27</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root {
            --sva-green: #1a4731;
            --sva-yellow: #facc15;
        }
        body { 
            background-color: var(--sva-green); 
            font-family: 'Inter', sans-serif; 
            color: #f8fafc;
            background-image: linear-gradient(rgba(26, 71, 49, 0.95), rgba(26, 71, 49, 0.95)), 
                              url('https://www.rwalfen.de/img/rwa.gif');
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
        }
        .match-card { 
            background: rgba(255, 255, 255, 0.1); 
            backdrop-filter: blur(8px);
            border-radius: 12px; 
            padding: 12px; 
            border-left: 4px solid var(--sva-yellow); 
            transition: all 0.5s ease; 
        }
        .slot {
            min-height: 48px; 
            background: rgba(255,255,255,0.05); 
            border: 1px dashed rgba(255,255,255,0.2); 
            border-radius: 8px; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            margin-top: 5px; 
            cursor: pointer; 
            font-size: 0.9rem; 
        }
        .slot.drag-over {
            outline: 2px solid var(--sva-yellow);
            outline-offset: 2px;
            background: rgba(250, 204, 21, 0.15);
        }
        .slot.selected-slot {
            outline: 2px solid #fff;
            outline-offset: 2px;
        }
        .slot.filled { 
            border-style: solid; 
            background: rgba(250, 204, 21, 0.2); 
            border-color: var(--sva-yellow); 
        }
        .player-chip { cursor: pointer; user-select: none; transition: all 0.2s; }
        .custom-scrollbar::-webkit-scrollbar { height: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: var(--sva-yellow); border-radius: 10px; }
    </style>
</head>
<body class="p-4 pb-48">

    <header class="mb-8 text-center pt-4">
        <img src="https://www.rwalfen.de/img/RWA-100-rot.png" alt="SVA Logo" class="h-16 mx-auto mb-4 drop-shadow-lg">
        <h1 class="text-2xl font-black text-white uppercase tracking-tighter">Hobbyligasaison 26/27</h1>
    </header>

    <div class="max-w-md mx-auto space-y-8" id="match-container">
        <div class="space-y-3">
            <h2 class="text-[10px] font-bold text-yellow-400/80 ml-1 uppercase tracking-widest">Einzel Aufstellung</h2>
            <div class="match-card" id="e1">
                <h3 class="font-bold text-xs text-white/70 mb-1">1. EINZEL</h3>
                <div class="slot" onclick="handleSlotClick(this, 'einzel')" ondragover="handleDragOver(event)" ondragleave="this.classList.remove('drag-over')" ondrop="handleDrop(event, 'einzel', 0)">Besetzen...</div>
            </div>
            <div class="match-card" id="e2">
                <h3 class="font-bold text-xs text-white/70 mb-1">2. EINZEL</h3>
                <div class="slot" onclick="handleSlotClick(this, 'einzel')" ondragover="handleDragOver(event)" ondragleave="this.classList.remove('drag-over')" ondrop="handleDrop(event, 'einzel', 1)">Besetzen...</div>
            </div>
        </div>

        <div class="space-y-3">
            <h2 class="text-[10px] font-bold text-yellow-400/80 ml-1 uppercase tracking-widest">Doppel Aufstellung</h2>
            <div id="doppel-list" class="space-y-3"></div>
        </div>
    </div>

    <div class="fixed bottom-0 left-0 right-0 z-50">
        <div class="bg-slate-900/90 backdrop-blur-md border-t border-white/10 p-4">
            <div id="bench" class="flex gap-2 overflow-x-auto pb-4 custom-scrollbar"></div>
            
            <div class="mt-4 text-center">
                <button id="share-button" onclick="shareLineup()" class="inline-flex items-center text-[11px] text-green-950 font-bold hover:bg-yellow-300 transition-colors bg-yellow-400 px-4 py-2 rounded-full">
                    Aufstellung als Bild teilen
                </button>
                <a href="https://dbv.turnier.de/sport/team.aspx?id=E4A5657E-EF6C-488C-958B-BE46490FD7E7&team=67" 
                   target="_blank" 
                   class="inline-flex items-center text-[11px] text-yellow-400 hover:text-white transition-colors bg-white/5 px-4 py-2 rounded-full border border-yellow-400/30 mt-2">
                    📊 Offizielle Staffel-Tabelle öffnen
                </a>
                <p id="share-status" class="text-[11px] text-white/70 mt-2" role="status" aria-live="polite"></p>
            </div>
        </div>
    </div>

    <script>
        const players = ["Michael", "Jokl", "Rainer", "Stephan", "Vanessa", "Damian", "Christian", "Sven", "Luis", "Ulli", "Tina", "Andrea", "Sylvia", "Alex"]
            .map((name, index) => ({ id: index + 1, name, rank: index + 1 }));

        let state = {
            einzel: [null, null],
            doppel: [[null, null], [null, null], [null, null]]
        };
        let selectedPlayerId = null;
        let selectedSlot = null;

        function render() {
            renderBench();
            renderEinzel();
            renderDoppel();
        }

        function renderBench() {
            const bench = document.getElementById('bench');
            bench.innerHTML = '';
            players.forEach(p => {
                const count = getUsage(p.id);
                const isSelected = selectedPlayerId === p.id;
                const div = document.createElement('div');
                div.className = `player-chip shrink-0 px-4 py-3 rounded-xl text-sm font-bold shadow-lg transition-all ${isSelected ? 'bg-yellow-400 text-green-900 scale-105' : 'bg-white/10 text-white'} ${count >= 2 ? 'opacity-20 grayscale' : ''}`;
                div.innerHTML = `<span class="opacity-60 mr-1">${p.rank}.</span> ${p.name}`;
                div.draggable = true;
                div.ondragstart = event => {
                    event.dataTransfer.setData('text/plain', String(p.id));
                    event.dataTransfer.effectAllowed = 'move';
                };
                div.onclick = () => {
                    if (selectedSlot) {
                        assignPlayer(selectedSlot, p);
                        return;
                    }
                    if (count < 2 || isSelected) {
                        selectedPlayerId = isSelected ? null : p.id;
                        render();
                    }
                };
                bench.appendChild(div);
            });
        }

        function getUsage(id) {
            let count = state.einzel.filter(p => p && p.id === id).length;
            state.doppel.forEach(d => count += d.filter(p => p && p.id === id).length);
            return count;
        }

        function renderEinzel() {
            const assigned = state.einzel.filter(Boolean).sort((a, b) => a.rank - b.rank);
            state.einzel = [assigned[0] || null, assigned[1] || null];
            [0, 1].forEach(i => {
                const slot = document.querySelectorAll('#match-container .match-card .slot')[i];
                const p = state.einzel[i];
                slot.innerHTML = p ? `<div class="font-bold text-yellow-400">${p.name} <span class="text-[9px] text-white/50 ml-1">R${p.rank}</span></div>` : 'Besetzen...';
                slot.className = `slot ${p ? 'filled' : ''} ${isSlotSelected('einzel', i) ? 'selected-slot' : ''}`;
            });
        }

        function renderDoppel() {
            const list = document.getElementById('doppel-list');
            const doppelData = state.doppel.map(pair => ({ pair, sum: (pair[0] && pair[1]) ? pair[0].rank + pair[1].rank : 999 }));
            doppelData.sort((a, b) => a.sum - b.sum);
            state.doppel = doppelData.map(d => d.pair);

            list.innerHTML = '';
            state.doppel.forEach((pair, i) => {
                const sum = (pair[0] && pair[1]) ? pair[0].rank + pair[1].rank : null;
                list.insertAdjacentHTML('beforeend', `
                    <div class="match-card">
                        <div class="flex justify-between items-center mb-1 text-[10px] font-bold text-white/50">
                            <span>${i+1}. DOPPEL</span>
                            ${sum ? `<span class="text-yellow-400">SUMME: ${sum}</span>` : ''}
                        </div>
                        <div class="grid grid-cols-2 gap-2">
                            <div class="slot ${pair[0] ? 'filled' : ''} ${isSlotSelected('doppel', i, 0) ? 'selected-slot' : ''}" onclick="handleDoppelClick(${i}, 0)" ondragover="handleDragOver(event)" ondragleave="this.classList.remove('drag-over')" ondrop="handleDrop(event, 'doppel', ${i}, 0)">
                                ${pair[0] ? `<span class="font-bold text-yellow-400">${pair[0].name}</span>` : 'Spieler A'}
                            </div>
                            <div class="slot ${pair[1] ? 'filled' : ''} ${isSlotSelected('doppel', i, 1) ? 'selected-slot' : ''}" onclick="handleDoppelClick(${i}, 1)" ondragover="handleDragOver(event)" ondragleave="this.classList.remove('drag-over')" ondrop="handleDrop(event, 'doppel', ${i}, 1)">
                                ${pair[1] ? `<span class="font-bold text-yellow-400">${pair[1].name}</span>` : 'Spieler B'}
                            </div>
                        </div>
                    </div>`);
            });
        }

        function handleDragOver(event) {
            event.preventDefault();
            event.currentTarget.classList.add('drag-over');
            event.dataTransfer.dropEffect = 'move';
        }

        function handleDrop(event, type, matchIndex, playerIndex) {
            event.preventDefault();
            event.currentTarget.classList.remove('drag-over');

            const playerId = Number(event.dataTransfer.getData('text/plain'));
            const player = players.find(p => p.id === playerId);
            if (!player) return;

            assignPlayer({ type, matchIndex, playerIndex: type === 'einzel' ? null : playerIndex }, player);
        }

        function handleSlotClick(el, type) {
            const index = Array.from(document.querySelectorAll('#e1 .slot, #e2 .slot')).indexOf(el);
            handleSlotSelection({ type, matchIndex: index, playerIndex: null });
        }

        function handleDoppelClick(pairIdx, playerIdx) {
            handleSlotSelection({ type: 'doppel', matchIndex: pairIdx, playerIndex: playerIdx });
        }

        function handleSlotSelection(slot) {
            if (selectedPlayerId !== null) {
                const player = players.find(p => p.id === selectedPlayerId);
                if (player) assignPlayer(slot, player);
                return;
            }

            selectedSlot = isSlotSelected(slot.type, slot.matchIndex, slot.playerIndex) ? null : slot;
            render();
        }

        function isSlotSelected(type, matchIndex, playerIndex = null) {
            return selectedSlot
                && selectedSlot.type === type
                && selectedSlot.matchIndex === matchIndex
                && selectedSlot.playerIndex === playerIndex;
        }

        function assignPlayer(slot, player) {
            const target = slot.type === 'einzel'
                ? state.einzel
                : state.doppel[slot.matchIndex];
            const slotIndex = slot.type === 'einzel' ? slot.matchIndex : slot.playerIndex;
            const currentPlayer = target[slotIndex];

            if (currentPlayer && currentPlayer.id === player.id) {
                selectedPlayerId = null;
                selectedSlot = null;
                render();
                return;
            }

            const otherPlayerInMatch = slot.type === 'einzel'
                ? state.einzel[1 - slotIndex]
                : state.doppel[slot.matchIndex][1 - slotIndex];
            if ((otherPlayerInMatch && otherPlayerInMatch.id === player.id) || getUsage(player.id) >= 2) return;

            target[slotIndex] = player;
            selectedPlayerId = null;
            selectedSlot = null;
            render();
        }

        function createLineupImage() {
            const canvas = document.createElement('canvas');
            const context = canvas.getContext('2d');
            if (!context) throw new Error('Canvas wird von diesem Browser nicht unterstützt.');

            const width = 1080;
            const padding = 72;
            const cardWidth = width - padding * 2;
            const singleCardHeight = 112;
            const doubleCardHeight = 148;
            const sectionGap = 34;
            const height = 300 + 52 + (singleCardHeight + 16) * 2 + sectionGap + 52 + (doubleCardHeight + 16) * 3 + padding;
            canvas.width = width;
            canvas.height = height;

            context.fillStyle = '#f8fafc';
            context.fillRect(0, 0, width, height);
            context.fillStyle = '#1a4731';
            context.fillRect(0, 0, width, 260);
            context.fillStyle = '#facc15';
            context.fillRect(padding, 68, 8, 116);

            context.textBaseline = 'top';
            context.fillStyle = '#facc15';
            context.font = 'bold 28px Arial, sans-serif';
            context.fillText('HOBBYLIGASAISON 26/27', padding + 30, 76);
            context.fillStyle = '#ffffff';
            context.font = 'bold 54px Arial, sans-serif';
            context.fillText('SPIELTAGAUFSTELLUNG', padding + 30, 116);
            context.fillStyle = 'rgba(255,255,255,0.75)';
            context.font = '24px Arial, sans-serif';
            context.fillText(`Erstellt am ${new Intl.DateTimeFormat('de-DE').format(new Date())}`, padding + 30, 190);

            function drawSectionTitle(title, y) {
                context.fillStyle = '#1a4731';
                context.font = 'bold 26px Arial, sans-serif';
                context.fillText(title, padding, y);
            }

            function drawCard(y, cardHeight, title, names) {
                context.fillStyle = '#ffffff';
                context.strokeStyle = '#dbe4df';
                context.lineWidth = 2;
                context.beginPath();
                context.roundRect(padding, y, cardWidth, cardHeight, 18);
                context.fill();
                context.stroke();
                context.fillStyle = '#1a4731';
                context.fillRect(padding, y + 1, 8, cardHeight - 2);
                context.fillStyle = '#64748b';
                context.font = 'bold 20px Arial, sans-serif';
                context.fillText(title, padding + 32, y + 20);

                const nameY = y + 62;
                const columnWidth = (cardWidth - 64) / names.length;
                names.forEach((player, index) => {
                    const x = padding + 32 + columnWidth * index;
                    context.fillStyle = player ? '#1a4731' : '#94a3b8';
                    context.font = 'bold 30px Arial, sans-serif';
                    context.fillText(player ? player.name : 'Noch offen', x, nameY);
                    if (player) {
                        context.fillStyle = '#64748b';
                        context.font = '20px Arial, sans-serif';
                        context.fillText(`Rang ${player.rank}`, x, nameY + 38);
                    }
                });
            }

            let y = 300;
            drawSectionTitle('EINZEL', y);
            y += 52;
            state.einzel.forEach((player, index) => {
                drawCard(y, singleCardHeight, `${index + 1}. EINZEL`, [player]);
                y += singleCardHeight + 16;
            });

            y += sectionGap - 16;
            drawSectionTitle('DOPPEL', y);
            y += 52;
            state.doppel.forEach((pair, index) => {
                drawCard(y, doubleCardHeight, `${index + 1}. DOPPEL`, pair);
                y += doubleCardHeight + 16;
            });

            return new Promise((resolve, reject) => {
                canvas.toBlob(blob => {
                    if (blob) resolve(blob);
                    else reject(new Error('Das Aufstellungsbild konnte nicht erstellt werden.'));
                }, 'image/png');
            });
        }

        async function shareLineup() {
            const button = document.getElementById('share-button');
            const status = document.getElementById('share-status');
            button.disabled = true;
            status.textContent = 'Bild wird erstellt...';

            try {
                const blob = await createLineupImage();
                const file = new File([blob], 'spieltagaufstellung.png', { type: 'image/png' });

                if (navigator.share && navigator.canShare && navigator.canShare({ files: [file] })) {
                    await navigator.share({
                        title: 'Spieltagaufstellung',
                        text: 'Unsere Aufstellung für den Spieltag',
                        files: [file]
                    });
                    status.textContent = 'Aufstellung wurde zum Teilen geöffnet.';
                } else {
                    const url = URL.createObjectURL(blob);
                    const downloadLink = document.createElement('a');
                    downloadLink.href = url;
                    downloadLink.download = file.name;
                    downloadLink.click();
                    setTimeout(() => URL.revokeObjectURL(url), 1000);
                    status.textContent = 'Bild heruntergeladen. Du kannst es jetzt in WhatsApp anhängen.';
                }
            } catch (error) {
                if (error.name === 'AbortError') {
                    status.textContent = 'Teilen abgebrochen.';
                } else {
                    console.error('Aufstellung konnte nicht geteilt werden:', error);
                    status.textContent = 'Das Bild konnte nicht erstellt oder geteilt werden.';
                }
            } finally {
                button.disabled = false;
            }
        }

        render();
    </script>
</body>
</html>
